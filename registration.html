<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
</head>
<body>
    <nav>
            <a href="index.html">Home</a> |
            <a href="login.html">Login</a> |
            <a href="categories.html">Categories</a>
    </nav>
   
    <h1>
        Register Yourself
    </h1>

    <h3>
        Already Registered? <a href="login.html">Login Here</a>
    </h3>
    
        <form action = "#" method = "POST">

        <p>
        <label for = "name">Enter Your Name: </label><br/>
        <input type = "text" id = "name">
        </p>
        
        <p>
            <label for="Male">Male: </label>
            <input type="radio" id="Male" name="gender" value="Male"><br/>
            <label for="Female">Female: </label>
            <input type="radio" id="Female" name="gender" value="Female">
        </p>

        <p>
            <label for="userId">Enter Your UserID: </label><br/>
            <input type="text" id="userId">
        </p>

        <p>
        <label for="password">Enter Your Password: </label><br/>
        <input type="password" id="password">
        </p>

        <p>
        <label for="email">Enter Your Email: </label><br/>
        <input type="email" id="email">
        </p>

        <p>
            <label for="address">Enter Your Address: </label><br/>
            <textarea id="address" name="address" rows="5" cols="30"></textarea>
        </p>
    
        <p>
            <h4>Shopping Interests</h4>
            <input type="checkbox" id="ele" name="electronics" value="electronics">
            <label for="ele">Electronics</label><br/>
            <input type="checkbox" id="fashion" name="fashion" value="Fashion">
            <label for="fashion">Fashion</label><br/>
            <input type="checkbox" id="books" name="books" value="Books">
            <label for="books">Books</label>
        </p>

        <p>
            <label for="category">Select the Category</label>
            <select id="category" name="category">
                <option value="Premium">Premium</option>
                <option value="Regular">Regular</option>
            </select>
        </p>

        <p>
        <input type="submit" value="Submit">
        </p> 
</form>

<footer>
    &copy; All rights reserved
</footer>

</body>
</html>
